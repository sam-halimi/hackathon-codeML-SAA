<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA · Mémoire de projet</title>
<meta name="theme-color" content="#0B2348">
<meta name="description" content="Projet 360 · NOVA : état du projet au 30 septembre 2026, réponses sourcées, chronologie, actions et mises à jour.">
<!--STYLES-->
</head>
<body>
<!--ICONES-->
<a class="lien-evitement" href="#contenu">Aller au contenu</a>

<header class="entete">
  <div class="entete-haut">
    <div class="titre-bloc">
      <h1><span class="marque"><svg class="marque-etoile" aria-hidden="true"><use href="#i-nova"/></svg>NOVA</span> <span class="titre-fin">Mémoire de projet</span></h1>
      <p class="situation" id="situation"></p>
    </div>
    <div class="entete-actions">
    <form class="recherche-rapide" id="form-question" role="search">
      <label for="champ-question" class="visuellement-cache">Poser une question sur le projet</label>
      <input id="champ-question" type="search" placeholder="Posez votre question…" autocomplete="off">
      <button type="submit" class="bouton primaire"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Chercher</button>
    </form>
    <button type="button" class="bouton bouton-aide" id="ouvrir-guide"><svg class="ic" aria-hidden="true"><use href="#i-circle-help"/></svg>Comment ça marche ?</button>
    </div>
  </div>
  <div class="bandeau-version" id="bandeau-version" hidden></div>
  <nav class="onglets" aria-label="Espaces de l'application">
    <button type="button" data-onglet="vue"><span class="num">01</span><svg class="ic" aria-hidden="true"><use href="#i-layout-dashboard"/></svg>Vue d'ensemble</button>
    <button type="button" data-onglet="questions"><span class="num">02</span><svg class="ic" aria-hidden="true"><use href="#i-message-circle-question"/></svg>Questions et preuves</button>
    <button type="button" data-onglet="historique"><span class="num">03</span><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg>Historique et décisions</button>
    <button type="button" data-onglet="actions"><span class="num">04</span><svg class="ic" aria-hidden="true"><use href="#i-list-checks"/></svg>Actions</button>
    <button type="button" data-onglet="documents"><span class="num">05</span><svg class="ic" aria-hidden="true"><use href="#i-folder-open"/></svg>Documents et mises à jour</button>
  </nav>
</header>

<main id="contenu" tabindex="-1"></main>

<footer class="pied">
  <p id="pied-texte"></p>
</footer>

<dialog id="visionneuse" aria-labelledby="visionneuse-titre">
  <div class="visionneuse-entete">
    <div>
      <span id="visionneuse-tuile"></span>
      <div><p class="visionneuse-sur" id="visionneuse-sur"></p>
      <h2 id="visionneuse-titre">Preuve</h2></div>
    </div>
    <button type="button" class="bouton" id="visionneuse-fermer"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>Fermer</button>
  </div>
  <div class="visionneuse-corps" id="visionneuse-corps"></div>
</dialog>

<dialog id="guide" aria-labelledby="guide-titre">
  <div class="guide-cadre" id="guide-cadre"></div>
</dialog>

<div id="zone-impression" aria-hidden="true"></div>
<div id="annonce" class="visuellement-cache" aria-live="polite"></div>

<!--DONNEES-->
<!--SCRIPTS-->
</body>
</html>
